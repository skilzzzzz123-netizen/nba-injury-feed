name: backfill SBR history (2023-26 openers and closes)

# Grading/development data for NBA Edge v2 (Nov 24 2026). Separate from "fetch" so it never delays the injury feed.
# Each run reads up to 160 past dates; when every date is done, sbr_backfill.py does nothing.
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
  push:
    paths: ["sbr_backfill.py"]

permissions:
  contents: write

concurrency:
  group: backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Backfill a batch of past dates
        run: python sbr_backfill.py

      - name: Commit and push if something changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A sbr/history
          if git diff --cached --quiet; then
            echo "nothing changed"
            exit 0
          fi
          git commit -m "backfill $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 7
          done
          exit 1
