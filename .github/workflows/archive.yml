name: archive (past injury reports and prices)

# Development data for the NBA Edge replay (plan of Nov 27 2026, Phase 1): the NBA's official injury reports for past
# seasons and ESPN's public opening and closing prices for past games. Separate from "fetch" so it never delays the
# live injury feed. Each run does a batch; when everything is done the scripts do nothing.
on:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:
  push:
    paths: ["archive_reports.py", "espn_backfill.py", "archive/games.csv", ".github/workflows/archive.yml"]

permissions:
  contents: write

concurrency:
  group: archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      # the branch as it is when the job STARTS, not as it was when the run was queued: a run queued behind another
      # one would otherwise redo that run's work and fail to push it (Nov 27 2026)
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the PDF reader (pypdf, as fetch.yml)
        run: python -m pip install --disable-pip-version-check "pypdf==6.17.0"

      - name: ESPN prices (up to 30 min; never fails the run), committed at once
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then E=60; else E=1800; fi
          python espn_backfill.py --limit-seconds $E || echo "espn backfill failed"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A archive
          if ! git diff --cached --quiet; then
            git commit -q -m "archive prices $(date -u +%Y-%m-%dT%H:%MZ)"
            for i in 1 2 3 4 5; do
              git pull -q --rebase origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && break
              sleep 7
            done
          fi

      - name: Past injury reports with the time that is left (never fails the run)
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then T=120; else T=1080; fi
          python archive_reports.py --limit-seconds $T || echo "report archive failed"

      - name: Commit and push if something changed
        run: |
          git add -A archive
          if git diff --cached --quiet; then
            echo "nothing changed"
            exit 0
          fi
          git commit -m "archive $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 7
          done
          exit 1
