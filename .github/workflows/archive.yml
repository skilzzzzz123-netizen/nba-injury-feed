name: archive (past injury reports and prices)

# Development data for the NBA Edge replay (plan of Nov 27 2026, Phase 1): the NBA's official injury reports for past
# seasons and ESPN's public opening and closing prices for past games. Separate from "fetch" so it never delays the
# live injury feed. Each run does a batch; when everything is done the scripts do nothing.
on:
  schedule:
    - cron: "13,43 * * * *"
  workflow_dispatch:
  push:
    paths: ["archive_reports.py", "espn_probe.py", "espn_backfill.py", "archive/games.csv", ".github/workflows/archive.yml"]

permissions:
  contents: write

concurrency:
  group: archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the PDF reader (pypdf, as fetch.yml)
        run: python -m pip install --disable-pip-version-check "pypdf==6.17.0"

      - name: One-off ESPN probe (only on a push; never fails the run)
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ -f espn_probe.py ]; then python espn_probe.py || echo "probe failed"; fi

      - name: ESPN prices for past games (once the script exists; never fails the run)
        run: |
          if [ -f espn_backfill.py ]; then
            if [ "${{ github.event_name }}" = "push" ]; then python espn_backfill.py --limit-seconds 150 || echo "espn backfill failed"
            else python espn_backfill.py || echo "espn backfill failed"; fi
          fi

      - name: Past injury reports (a short batch on a push, a full one on the schedule)
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then python archive_reports.py --limit-seconds 120 || echo "report archive failed"
          else python archive_reports.py || echo "report archive failed"; fi

      - name: Commit and push if something changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A archive
          if git diff --cached --quiet; then
            echo "nothing changed"
            exit 0
          fi
          git commit -m "archive $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 7
          done
          exit 1
