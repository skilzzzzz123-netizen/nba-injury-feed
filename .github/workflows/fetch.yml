name: fetch injury reports

on:
  schedule:
    - cron: "*/15 16-23,0-5 * * *"   # UTC: about 11 AM to 1 AM ET
  workflow_dispatch:
  push:
    paths: ["sbr_snap.py", "props_snap.py", "sbr_probe.py"]   # run once when the snapshot script changes

permissions:
  contents: write

concurrency:
  group: fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the PDF reader (pypdf, as scripts/pdfs_to_text.py)
        run: python -m pip install --disable-pip-version-check "pypdf==6.17.0"

      - name: Fetch
        run: python fetch.py

      - name: Snapshot player props (grading only; never fails the run)
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then python props_snap.py --force manual || echo "props snapshot failed"
          else python props_snap.py || echo "props snapshot failed"; fi

      - name: Snapshot Sportsbook Review (grading only; never fails the run)
        run: python sbr_snap.py || echo "sbr snapshot failed"

      - name: One-off past-date probe (only on a push that changes it)
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ -f sbr_probe.py ]; then python sbr_probe.py || echo "probe failed"; fi

      - name: Commit and push if something changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A reports text attempts.csv sbr props 2>/dev/null || git add -A
          if git diff --cached --quiet; then
            echo "nothing changed"
            exit 0
          fi
          git commit -m "fetch $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 5
          done
          exit 1
